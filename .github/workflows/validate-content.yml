name: Validate content

on:
  pull_request:
  workflow_dispatch:  # Manual trigger — validates ALL content files

jobs:
  validate:
    runs-on: ubuntu-latest
    # Read-only is intentional — write permissions are handled by the
    # validate-content-comment workflow via workflow_run, so that fork PRs
    # (which always get a read-only token on pull_request) can still get
    # validation comments posted on them.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Get changed content files
        id: changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v44
        with:
          files: 'src/content/**/*.md'
          json: true
          escape_json: false
          safe_output: false  # JSON is passed through env and argv, never shell interpolation

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.any_changed == 'true'
        with:
          node-version: 20

      - run: npm install --no-save tsx gray-matter --no-audit --no-fund
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.any_changed == 'true'

      - name: Validate changed files
        id: validate
        if: github.event_name == 'pull_request' && steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        env:
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          node -e 'const {spawnSync}=require("node:child_process"); const files=JSON.parse(process.env.CHANGED_FILES_JSON); if (!Array.isArray(files) || files.some(f => typeof f !== "string" || !/^src\/content\/(apps|mechanisms|research|case-studies|campaigns)\/.+\.md$/.test(f))) process.exit(2); const r=spawnSync("npx",["tsx","scripts/validate-content.ts",...files],{encoding:"utf8"}); require("node:fs").writeFileSync("/tmp/validate-output.txt",(r.stdout||"")+(r.stderr||"")); process.stdout.write((r.stdout||"")+(r.stderr||"")); process.exit(r.status ?? 1)'

      - name: Validate all files
        if: github.event_name == 'workflow_dispatch'
        run: npx tsx scripts/validate-content.ts

      # Save PR metadata as an artifact so validate-content-comment can read it.
      # Must run before "Fail if validation failed" so the artifact is always uploaded
      # even when validation fails.
      - name: Save PR metadata for comment workflow
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          CHANGED: ${{ steps.changed.outputs.any_changed }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          mkdir -p /tmp/pr-info
          printf '%s\n' "$PR_NUMBER" > /tmp/pr-info/pr-number.txt
          printf '%s\n' "$PR_BRANCH" > /tmp/pr-info/branch.txt
          if [ "$CHANGED" != "true" ]; then
            echo "skip" > /tmp/pr-info/outcome.txt
            echo ""     > /tmp/pr-info/output.txt
          else
            printf '%s\n' "$VALIDATION_OUTCOME" > /tmp/pr-info/outcome.txt
            cp /tmp/validate-output.txt /tmp/pr-info/output.txt 2>/dev/null || echo "" > /tmp/pr-info/output.txt
          fi

      - name: Upload PR metadata artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: /tmp/pr-info/
          retention-days: 1

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
